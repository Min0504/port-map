<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Port Map</title>
<style>
  :root {
    --bg: rgba(20, 22, 28, 0.88);
    --card: rgba(40, 44, 52, 0.92);
    --card-hover: rgba(50, 55, 64, 0.95);
    --text: #e4e6eb;
    --dim: #8b8f96;
    --accent: #5b9dff;
    --warn: #f0a040;
    --err: #e05050;
    --ok: #50c878;
  }
  :root[data-theme="light"] {
    --bg: rgba(245, 246, 248, 0.92);
    --card: rgba(255, 255, 255, 0.95);
    --card-hover: rgba(235, 238, 245, 1);
    --text: #1a1d24;
    --dim: #6b7280;
    --accent: #2563eb;
    --warn: #d97706;
    --err: #dc2626;
    --ok: #16a34a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", "Segoe UI", sans-serif;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    border-radius: 12px;
  }
  /* 드래그 핸들 — 이 영역만 창 이동 가능 */
  #drag-handle {
    height: 32px;
    background: var(--bg);
    -webkit-app-region: drag;
    app-region: drag;
    cursor: grab;
    display: flex;
    align-items: center;
    padding: 0 10px;
    border-radius: 12px 12px 0 0;
    gap: 8px;
  }
  #drag-handle:active { cursor: grabbing; }
  #drag-handle .title { font-weight: 700; font-size: 12px; letter-spacing: 0.3px; }
  #drag-handle .count {
    color: var(--dim); font-size: 11px;
    background: rgba(255,255,255,0.06); padding: 1px 7px; border-radius: 8px;
  }
  :root[data-theme="light"] #drag-handle .count { background: rgba(0,0,0,0.06); }
  #drag-handle .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
  }
  #drag-handle .dot.err { background: var(--err); }
  #drag-handle .dot.warn { background: var(--warn); }
  /* 창 제어 버튼 (끄기, 최소화, 설정) */
  #window-controls {
    margin-left: auto;
    display: flex; gap: 6px;
    -webkit-app-region: no-drag;
    app-region: no-drag;
  }
  .win-btn {
    width: 14px; height: 14px; border-radius: 50%;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: rgba(0,0,0,0.5);
    transition: filter 0.15s;
  }
  .win-btn:hover { filter: brightness(1.15); }
  .win-btn.minimize { background: #f0a040; }
  .win-btn.theme { background: #5b9dff; }
  .win-btn.close { background: #e05050; }
  #container {
    background: var(--bg);
    border-radius: 0 0 12px 12px;
    padding: 8px;
    height: calc(100vh - 32px);
    display: flex;
    flex-direction: column;
  }
  #search {
    width: 100%;
    padding: 7px 12px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    color: var(--text);
    font-size: 12px;
    margin-bottom: 8px;
    transition: border-color 0.2s;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  #search::placeholder { color: var(--dim); }
  #grid {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.15) transparent;
  }
  #grid::-webkit-scrollbar { width: 4px; }
  #grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
  .card {
    cursor: pointer;
    background: var(--card);
    border-radius: 8px;
    padding: 8px 10px;
    transition: background 0.15s, opacity 0.3s, border-color 0.15s;
    border: 1px solid transparent;
    position: relative;
  }
  .card:hover { background: var(--card-hover); border-color: rgba(91,157,255,0.25); }
  .card.new { animation: fadeIn 0.3s ease; }
  .card.gone { opacity: 0; pointer-events: none; transform: scale(0.95); }
  .card.pinned { border-left: 3px solid var(--accent); }
  .card.alert-new { animation: alertPulse 1.5s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  @keyframes alertPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(80,200,120,0); }
    50% { box-shadow: 0 0 8px 2px rgba(80,200,120,0.3); }
  }
  .card-head { display: flex; align-items: center; gap: 6px; }
  .card-port {
    font-weight: 700; font-size: 14px; color: var(--accent);
    min-width: 48px; font-variant-numeric: tabular-nums;
    cursor: pointer; /* 클릭하면 복사 */
  }
  .card-port:hover { text-decoration: underline; }
  .card-proc { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .badge { font-size: 9px; padding: 1px 5px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
  .badge.tcp { background: rgba(91,157,255,0.18); color: var(--accent); }
  .badge.udp { background: rgba(80,200,120,0.18); color: var(--ok); }
  .badge.ipv6 { background: rgba(180,140,220,0.18); color: #b48cdc; }
  .badge.denied { background: rgba(224,80,80,0.18); color: var(--err); }
  .badge.limited { background: rgba(240,160,64,0.18); color: var(--warn); }
  .pin-btn {
    background: none; border: none; cursor: pointer;
    color: var(--dim); font-size: 12px; padding: 0 2px;
    opacity: 0; transition: opacity 0.15s;
  }
  .card:hover .pin-btn { opacity: 0.6; }
  .pin-btn:hover { opacity: 1; color: var(--accent); }
  .card.pinned .pin-btn { opacity: 1; color: var(--accent); }
  .card-detail {
    margin-top: 6px; padding-top: 6px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 11px; color: var(--dim);
    display: none; line-height: 1.5;
  }
  :root[data-theme="light"] .card-detail { border-top-color: rgba(0,0,0,0.08); }
  .card.expanded .card-detail { display: block; }
  .card-detail .row { word-break: break-all; }
  .card-detail .label { color: var(--dim); display: inline-block; min-width: 52px; }
  .card-detail .val { color: var(--text); }
  .kill-btn {
    margin-top: 8px; padding: 4px 12px;
    background: rgba(224,80,80,0.15); color: var(--err);
    border: 1px solid rgba(224,80,80,0.3); border-radius: 6px;
    font-size: 11px; font-weight: 600; cursor: pointer;
    transition: background 0.15s;
  }
  .kill-btn:hover { background: rgba(224,80,80,0.3); }
  .kill-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .kill-result {
    margin-top: 4px; font-size: 10px; font-weight: 600;
  }
  .kill-result.ok { color: var(--ok); }
  .kill-result.err { color: var(--err); }
  #status-msg {
    text-align: center; color: var(--dim);
    padding: 40px 10px; font-size: 12px;
  }
  #status-msg.error { color: var(--err); }
  #status-msg .retry { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .warn-bar {
    background: rgba(240,160,64,0.15); color: var(--warn);
    font-size: 10px; padding: 3px 8px; border-radius: 6px;
    margin-bottom: 6px; text-align: center; display: none;
  }
  /* 탭 바 */
  .tab-bar {
    display: flex; gap: 0; margin-bottom: 8px;
    border-radius: 8px; overflow: hidden;
    background: rgba(255,255,255,0.04);
  }
  :root[data-theme="light"] .tab-bar { background: rgba(0,0,0,0.04); }
  .tab {
    flex: 1; padding: 7px 0; text-align: center;
    font-size: 11px; font-weight: 600; color: var(--dim);
    cursor: pointer; border: none; background: none;
    transition: background 0.15s, color 0.15s;
    user-select: none; -webkit-user-select: none;
    border-bottom: 2px solid transparent;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--accent);
    background: rgba(91,157,255,0.1);
    border-bottom-color: var(--accent);
  }
  .tab .tab-count {
    display: inline-block; margin-left: 4px;
    font-size: 9px; padding: 0 5px; border-radius: 8px;
    background: rgba(255,255,255,0.08); color: var(--dim);
  }
  .tab.active .tab-count {
    background: rgba(91,157,255,0.2); color: var(--accent);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: flex; flex-direction: column; gap: 4px; }
  /* 꺼진 포트 카드 */
  .closed-card {
    background: var(--card); border-radius: 7px;
    padding: 6px 10px; border: 1px solid transparent;
    opacity: 0.7; transition: opacity 0.2s;
  }
  .closed-card:hover { opacity: 0.9; border-color: rgba(255,255,255,0.06); }
  .closed-card .card-head { display: flex; align-items: center; gap: 6px; }
  .closed-card .card-port { font-weight: 700; font-size: 13px; color: var(--dim); min-width: 48px; font-variant-numeric: tabular-nums; }
  .closed-card .card-proc { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; color: var(--dim); }
  .closed-card .last-seen { font-size: 9px; color: var(--dim); margin-top: 2px; }
  /* 토스트 알림 */
  #toast {
    position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
    background: var(--card); color: var(--text);
    padding: 6px 14px; border-radius: 8px; font-size: 11px;
    border: 1px solid rgba(91,157,255,0.3);
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
    z-index: 100;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="drag-handle">
  <span class="dot" id="status-dot"></span>
  <span class="title">Port Map</span>
  <span class="count" id="count">0</span>
  <span id="window-controls">
    <button class="win-btn theme" id="btn-theme" title="테마 전환">◐</button>
    <button class="win-btn minimize" id="btn-minimize" title="최소화">—</button>
    <button class="win-btn close" id="btn-close" title="종료">✕</button>
  </span>
</div>
<div id="container">
  <div class="warn-bar" id="warn-bar">스캐너 확인 필요 — 연속 실패</div>
  <div class="tab-bar">
    <button class="tab active" id="tab-active" data-tab="active">
      사용 중 <span class="tab-count" id="active-count">0</span>
    </button>
    <button class="tab" id="tab-closed" data-tab="closed">
      사용 가능 <span class="tab-count" id="closed-count">0</span>
    </button>
  </div>
  <input id="search" type="text" placeholder="포트 또는 프로세스명..." spellcheck="false">
  <div id="tab-panel-active" class="tab-panel active">
    <div id="grid"></div>
    <div id="status-msg" style="display:none"></div>
  </div>
  <div id="tab-panel-closed" class="tab-panel">
    <div id="closed-grid"></div>
    <div id="closed-status" style="text-align:center;color:var(--dim);padding:40px 10px;font-size:12px;">사용 가능한 포트 없음</div>
  </div>
</div>
<div id="toast"></div>
<script>
const params = new URLSearchParams(location.search);
const POLL_INTERVAL = parseInt(params.get('interval') || '3');
const OPACITY = parseFloat(params.get('opacity') || '0.88');
const THEME = params.get('theme') || 'dark';
const SOUND_ALERT = params.get('sound') !== 'false';

// 테마 적용
document.documentElement.setAttribute('data-theme', THEME);
document.documentElement.style.setProperty('--bg',
  THEME === 'light' ? `rgba(245,246,248,${OPACITY})` : `rgba(20,22,28,${OPACITY})`);

let lastPorts = new Map();
let expandedSet = new Set();
let searchQuery = '';
let scanInProgress = false;
let failCount = 0;
let favorites = new Set();    // 고정할 포트 번호
let prevPortKeys = new Set(); // 이전 스캔의 포트 키 (새 포트 감지용)
let currentTheme = THEME;
let activeTab = 'active';     // 'active' | 'closed'

const grid = document.getElementById('grid');
const statusMsg = document.getElementById('status-msg');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');
const warnBar = document.getElementById('warn-bar');
const statusDot = document.getElementById('status-dot');
const closedGrid = document.getElementById('closed-grid');
const closedStatus = document.getElementById('closed-status');
const activeCountEl = document.getElementById('active-count');
const closedCountEl = document.getElementById('closed-count');
const tabActive = document.getElementById('tab-active');
const tabClosed = document.getElementById('tab-closed');
const panelActive = document.getElementById('tab-panel-active');
const panelClosed = document.getElementById('tab-panel-closed');
const toastEl = document.getElementById('toast');

// 창 제어 버튼
// pywebview expose 함수는 window.pywebview.api 에 등록됨
function callPyApi(name, ...args) {
  const api = window.pywebview?.api;
  if (api && typeof api[name] === 'function') {
    return api[name](...args);
  }
  return null;
}

document.getElementById('btn-close').addEventListener('click', () => {
  const r = callPyApi('close_window');
  if (r === null) {
    // 폴백 — 일반 window.close
    window.close();
  }
});
document.getElementById('btn-minimize').addEventListener('click', () => {
  const r = callPyApi('minimize_window');
  if (r === null) {
    // 폴백 — 컨테이너 숨기기
    document.getElementById('container').style.display = 'none';
  }
});
document.getElementById('btn-theme').addEventListener('click', () => {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);
  document.documentElement.style.setProperty('--bg',
    currentTheme === 'light' ? `rgba(245,246,248,${OPACITY})` : `rgba(20,22,28,${OPACITY})`);
  callPyApi('save_setting', 'theme', currentTheme);
  showToast(currentTheme === 'dark' ? '다크 테마' : '라이트 테마');
});

// 탭 전환
tabActive.addEventListener('click', () => switchTab('active'));
tabClosed.addEventListener('click', () => switchTab('closed'));

function switchTab(tab) {
  activeTab = tab;
  tabActive.classList.toggle('active', tab === 'active');
  tabClosed.classList.toggle('active', tab === 'closed');
  panelActive.classList.toggle('active', tab === 'active');
  panelClosed.classList.toggle('active', tab === 'closed');
  applyFilter();
}

searchEl.addEventListener('input', () => {
  searchQuery = searchEl.value.trim().toLowerCase();
  applyFilter();
});

let lastClosedPorts = [];

function applyFilter() {
  // 활성 탭의 카드 필터
  document.querySelectorAll('#grid .card').forEach(card => {
    const port = card.dataset.port;
    const proc = card.dataset.proc;
    const match = !searchQuery ||
      port.includes(searchQuery) || proc.toLowerCase().includes(searchQuery);
    card.style.display = match ? '' : 'none';
  });
  // 꺼진 탭도 같은 검색어로 필터
  renderClosed(lastClosedPorts);
}

function cardKey(p) {
  // 같은 포트+PID면 IPv4/IPv6을 하나로 합침 (PID가 있을 때만)
  if (p.pid) return `${p.port}:${p.pid}`;
  return `${p.port}:${p.family}`;
}

function portFamilies(ports) {
  // 같은 cardKey로 들어온 포트들의 family 정보 수집
  const fams = new Set();
  ports.forEach(p => {
    const k = cardKey(p);
    // 원래 family 기록 — 합쳐진 카드에 v4+v6 표시용
  });
  return fams;
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2000);
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    showToast('복사됨: ' + text);
  }).catch(() => {
    // 폴백
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('복사됨: ' + text);
  });
}

function playAlertSound() {
  if (!SOUND_ALERT) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  } catch (e) {}
}

function render(snapshot) {
  if (snapshot.error) {
    failCount++;
    statusDot.className = 'dot err';
    if (failCount >= 3) {
      warnBar.style.display = '';
      statusMsg.style.display = '';
      statusMsg.className = 'error';
      statusMsg.innerHTML = `스캔 실패: ${escapeHtml(snapshot.error)} <span class="retry" onclick="poll()">재시도</span>`;
    }
    return;
  }

  failCount = 0;
  statusDot.className = 'dot';
  warnBar.style.display = 'none';
  statusMsg.style.display = 'none';

  const rawPorts = snapshot.ports || [];

  // 같은 (포트, PID)인 포트들을 하나로 합침 — family 정보는 families 배열로 수집
  const merged = new Map();
  for (const p of rawPorts) {
    const key = cardKey(p);
    if (merged.has(key)) {
      const existing = merged.get(key);
      if (!existing.families.includes(p.family)) existing.families.push(p.family);
    } else {
      merged.set(key, {...p, families: [p.family]});
    }
  }
  const ports = [...merged.values()];

  const newKeys = new Set(ports.map(cardKey));

  // 새 포트 감지 (이전에 없던 포트)
  const trulyNew = [];
  for (const p of ports) {
    const key = cardKey(p);
    if (!prevPortKeys.has(key) && prevPortKeys.size > 0) {
      trulyNew.push(p);
    }
  }
  if (trulyNew.length > 0) {
    playAlertSound();
    showToast(`새 포트: ${trulyNew.map(p => p.port).join(', ')}`);
  }
  prevPortKeys = newKeys;

  // 사라진 포트 페이드아웃
  for (const [key, el] of lastPorts) {
    if (!newKeys.has(key)) {
      el.classList.add('gone');
      const toRemove = el;
      setTimeout(() => toRemove.remove(), 300);
      lastPorts.delete(key);
      expandedSet.delete(key);
    }
  }

  // 즐겨찾기 포트를 상단으로 정렬
  ports.sort((a, b) => {
    const aPin = favorites.has(a.port);
    const bPin = favorites.has(b.port);
    if (aPin !== bPin) return aPin ? -1 : 1;
    return a.port - b.port;
  });

  // 새/변경 포트
  for (const p of ports) {
    const key = cardKey(p);
    let el = lastPorts.get(key);
    if (!el) {
      el = createCard(p);
      grid.appendChild(el);
      lastPorts.set(key, el);
      el.classList.add('new');
      if (trulyNew.some(t => cardKey(t) === key)) {
        el.classList.add('alert-new');
      }
    } else {
      updateCard(el, p);
    }
  }

  countEl.textContent = ports.length;
  activeCountEl.textContent = ports.length;
  if (ports.length === 0) {
    statusMsg.style.display = '';
    statusMsg.className = '';
    statusMsg.textContent = '점유 중인 포트 없음';
  } else {
    statusMsg.style.display = 'none';
  }

  renderClosed(snapshot.closed_ports || []);
  applyFilter();
}

function renderClosed(closedPorts) {
  lastClosedPorts = closedPorts || [];
  closedCountEl.textContent = closedPorts.length;
  if (closedPorts.length === 0) {
    closedStatus.style.display = '';
    closedStatus.textContent = '사용 가능한 포트 없음';
    closedGrid.innerHTML = '';
    return;
  }
  closedStatus.style.display = 'none';
  // 검색 필터 적용
  const filtered = closedPorts.filter(p => {
    if (!searchQuery) return true;
    return String(p.port).includes(searchQuery) ||
           p.process.toLowerCase().includes(searchQuery);
  });
  if (filtered.length === 0) {
    closedStatus.style.display = '';
    closedStatus.textContent = '검색 결과 없음';
    closedGrid.innerHTML = '';
    return;
  }
  closedGrid.innerHTML = filtered.map(p => {
    const ago = timeAgo(p.last_seen);
    return `
      <div class="closed-card">
        <div class="card-head">
          <span class="card-port">${p.port}</span>
          <span class="card-proc">${escapeHtml(p.process)}</span>
          <span class="badge ${p.protocol}">${p.protocol}</span>
        </div>
        <div class="last-seen">${ago} 전 사용 중단 · 다시 사용 가능</div>
      </div>
    `;
  }).join('');
}

function timeAgo(iso) {
  if (!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  const sec = Math.floor(diff / 1000);
  if (sec < 60) return sec + '초 전';
  const min = Math.floor(sec / 60);
  if (min < 60) return min + '분 전';
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + '시간 전';
  return Math.floor(hr / 24) + '일 전';
}

function createCard(p) {
  const el = document.createElement('div');
  el.className = 'card';
  updateCard(el, p);
  el.addEventListener('click', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
    if (e.target.classList.contains('pin-btn') || e.target.classList.contains('card-port')) return;
    const key = cardKey(p);
    if (expandedSet.has(key)) {
      expandedSet.delete(key);
      el.classList.remove('expanded');
    } else {
      expandedSet.add(key);
      el.classList.add('expanded');
    }
    updateCard(el, p);
  });
  return el;
}

function updateCard(el, p) {
  const key = cardKey(p);
  el.dataset.port = String(p.port);
  el.dataset.proc = p.process;
  const isPinned = favorites.has(p.port);
  if (isPinned) el.classList.add('pinned');
  else el.classList.remove('pinned');
  const protoBadge = `<span class="badge ${p.protocol}">${p.protocol}</span>`;
  const fams = p.families || [p.family];
  const famBadge = fams.length > 1 ? `<span class="badge ipv6">v4+v6</span>` :
    fams[0] === 'ipv6' ? `<span class="badge ipv6">v6</span>` : '';
  const permBadge = p.permission === 'full' ? '' :
    `<span class="badge ${p.permission}">${p.permission === 'denied' ? '권한부족' : '제한'}</span>`;
  const pinBtn = `<button class="pin-btn" onclick="togglePin(${p.port}, event)" title="고정">${isPinned ? '📌' : '○'}</button>`;
  const detail = expandedSet.has(key) ? buildDetail(p) : '';
  el.innerHTML = `
    <div class="card-head">
      <span class="card-port" onclick="copyPort(${p.port}, event)" title="클릭하여 주소 복사 (localhost:포트)">${p.port}</span>
      <span class="card-proc">${escapeHtml(p.process)}</span>
      ${pinBtn}
      ${protoBadge}${famBadge}${permBadge}
    </div>
    <div class="card-detail">${detail}</div>
  `;
  if (expandedSet.has(key)) el.classList.add('expanded');
}

function buildDetail(p) {
  const cmd = p.cmdline ? escapeHtml(p.cmdline) : '<span style="color:var(--err)">(권한 부족)</span>';
  const killBtn = p.pid ? `
    <button class="kill-btn" onclick="killPort(${p.pid}, event)">연결 해제</button>
    <div class="kill-result" id="kill-result-${p.pid}"></div>
  ` : '';
  return `
    <div class="row"><span class="label">PID</span><span class="val">${p.pid ?? '?'}</span></div>
    <div class="row"><span class="label">명령어</span><span class="val">${cmd}</span></div>
    <div class="row"><span class="label">원격</span><span class="val">${p.remote || '—'}</span></div>
    <div class="row"><span class="label">상태</span><span class="val">${p.state}</span></div>
    ${killBtn}
  `;
}

function togglePin(port, event) {
  if (event) event.stopPropagation();
  if (favorites.has(port)) {
    favorites.delete(port);
    showToast('고정 해제: ' + port);
  } else {
    favorites.add(port);
    showToast('고정: ' + port);
  }
  callPyApi('save_setting', 'favorites', [...favorites]);
  // 재렌더
  poll();
}

function copyPort(port, event) {
  if (event) event.stopPropagation();
  // 포트 접속 주소 복사 — http://localhost:PORT
  copyToClipboard('http://localhost:' + port);
}

async function killPort(pid, event) {
  if (event) event.stopPropagation();
  if (!confirm('PID ' + pid + ' 프로세스를 종료하시겠습니까?')) return;
  const resultEl = document.getElementById('kill-result-' + pid);
  if (resultEl) resultEl.textContent = '종료 중...';
  try {
    const r = await fetch('/api/kill', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({pid: pid})
    });
    const data = await r.json();
    if (data.ok) {
      if (resultEl) { resultEl.textContent = '✓ 종료됨'; resultEl.className = 'kill-result ok'; }
      setTimeout(() => poll(), 500);
    } else {
      const hint = data.hint ? ' (' + data.hint + ')' : '';
      if (resultEl) {
        resultEl.textContent = '✗ ' + (data.error || '실패') + hint;
        resultEl.className = 'kill-result err';
      }
    }
  } catch (e) {
    if (resultEl) { resultEl.textContent = '✗ 연결 실패'; resultEl.className = 'kill-result err'; }
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = String(s ?? '');
  return d.innerHTML;
}

async function poll() {
  if (scanInProgress) return;
  scanInProgress = true;
  try {
    const r = await fetch('/api/ports', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    render(data);
  } catch (e) {
    failCount++;
    statusDot.className = 'dot err';
    statusMsg.style.display = '';
    statusMsg.className = 'error';
    statusMsg.innerHTML = `서버 연결 실패 <span class="retry" onclick="poll()">재시도</span>`;
  } finally {
    scanInProgress = false;
  }
}

poll();
setInterval(poll, POLL_INTERVAL * 1000);
</script>
</body>
</html>
