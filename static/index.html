<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Port Map</title>
<style>
  :root {
    --bg: rgba(20, 22, 28, 0.85);
    --card: rgba(40, 44, 52, 0.9);
    --text: #e4e6eb;
    --dim: #8b8f96;
    --accent: #5b9dff;
    --warn: #f0a040;
    --err: #e05050;
    --ok: #50c878;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  /* 드래그 핸들 (상단 28px) */
  #drag-handle {
    height: 28px;
    background: var(--bg);
    -webkit-app-region: drag;
    app-region: drag;
    cursor: grab;
    display: flex;
    align-items: center;
    padding: 0 10px;
    border-radius: 10px 10px 0 0;
  }
  #drag-handle:active { cursor: grabbing; }
  #drag-handle .title { font-weight: 600; font-size: 12px; }
  #drag-handle .count { margin-left: auto; color: var(--dim); font-size: 11px; }
  #container {
    background: var(--bg);
    border-radius: 0 0 10px 10px;
    padding: 8px;
    height: calc(100vh - 28px);
    display: flex;
    flex-direction: column;
  }
  #search {
    width: 100%;
    padding: 6px 10px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    color: var(--text);
    font-size: 12px;
    margin-bottom: 8px;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  #grid {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .card {
    background: var(--card);
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
    transition: opacity 0.3s, background 0.2s;
    border: 1px solid transparent;
  }
  .card:hover { border-color: rgba(91,157,255,0.3); }
  .card.new { animation: fadeIn 0.3s; }
  .card.gone { opacity: 0; pointer-events: none; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  .card-head {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-port { font-weight: 700; font-size: 14px; color: var(--accent); min-width: 52px; }
  .card-proc { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 4px;
    font-weight: 600;
  }
  .badge.tcp { background: rgba(91,157,255,0.2); color: var(--accent); }
  .badge.udp { background: rgba(80,200,120,0.2); color: var(--ok); }
  .badge.denied { background: rgba(224,80,80,0.2); color: var(--err); }
  .badge.limited { background: rgba(240,160,64,0.2); color: var(--warn); }
  .card-detail {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 11px;
    color: var(--dim);
    display: none;
  }
  .card.expanded .card-detail { display: block; }
  .card-detail .row { margin: 2px 0; word-break: break-all; }
  .card-detail .label { color: var(--dim); }
  .card-detail .val { color: var(--text); }
  #empty, #error {
    text-align: center;
    color: var(--dim);
    padding: 40px 10px;
    font-size: 12px;
  }
  #error { color: var(--err); }
  .warn-badge {
    background: var(--warn);
    color: #1a1a1a;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    margin-bottom: 6px;
    display: none;
  }
</style>
</head>
<body>
<div id="drag-handle">
  <span class="title">Port Map</span>
  <span class="count" id="count">0</span>
</div>
<div id="container">
  <div class="warn-badge" id="warn-badge">스캐너 확인 필요</div>
  <input id="search" type="text" placeholder="포트번호 또는 프로세스명..." spellcheck="false">
  <div id="grid"></div>
  <div id="empty" style="display:none">점유 중인 포트 없음</div>
  <div id="error" style="display:none"></div>
</div>
<script>
const POLL_INTERVAL = new URLSearchParams(location.search).get('interval') || 3;
let lastPorts = new Map();  // port:family -> card data
let expandedSet = new Set(); // "port:family" keys that are expanded
let searchQuery = '';
let scanInProgress = false;

const grid = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const errorEl = document.getElementById('error');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');
const warnBadge = document.getElementById('warn-badge');

searchEl.addEventListener('input', () => {
  searchQuery = searchEl.value.trim().toLowerCase();
  applyFilter();
});

function applyFilter() {
  document.querySelectorAll('.card').forEach(card => {
    const port = card.dataset.port;
    const proc = card.dataset.proc;
    const match = !searchQuery ||
      port.includes(searchQuery) || proc.toLowerCase().includes(searchQuery);
    card.style.display = match ? '' : 'none';
  });
}

function cardKey(p) { return `${p.port}:${p.family}`; }

function render(snapshot) {
  const ports = snapshot.ports || [];
  const newKeys = new Set(ports.map(cardKey));

  // 사라진 포트 페이드아웃
  for (const [key, el] of lastPorts) {
    if (!newKeys.has(key)) {
      el.classList.add('gone');
      setTimeout(() => el.remove(), 300);
      lastPorts.delete(key);
      expandedSet.delete(key);
    }
  }

  // 새/변경 포트
  for (const p of ports) {
    const key = cardKey(p);
    let el = lastPorts.get(key);
    if (!el) {
      el = createCard(p);
      grid.appendChild(el);
      lastPorts.set(key, el);
      el.classList.add('new');
    } else {
      updateCard(el, p);
    }
  }

  // 카운트/빈 상태
  countEl.textContent = ports.length;
  emptyEl.style.display = ports.length === 0 && !snapshot.error ? '' : 'none';
  errorEl.style.display = snapshot.error ? '' : 'none';
  if (snapshot.error) errorEl.textContent = '스캔 실패: ' + snapshot.error;
  warnBadge.style.display = snapshot.error ? '' : 'none';

  applyFilter();
}

function createCard(p) {
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.port = String(p.port);
  el.dataset.proc = p.process;
  updateCard(el, p);
  el.addEventListener('dblclick', () => {
    const key = cardKey(p);
    if (expandedSet.has(key)) {
      expandedSet.delete(key);
      el.classList.remove('expanded');
    } else {
      expandedSet.add(key);
      el.classList.add('expanded');
    }
  });
  return el;
}

function updateCard(el, p) {
  const key = cardKey(p);
  el.dataset.proc = p.process;
  const protoBadge = `<span class="badge ${p.protocol}">${p.protocol}</span>`;
  const permBadge = p.permission === 'full' ? '' :
    `<span class="badge ${p.permission}">${p.permission === 'denied' ? '권한부족' : '제한'}</span>`;
  const detail = expandedSet.has(key) ? buildDetail(p) : '';
  el.innerHTML = `
    <div class="card-head">
      <span class="card-port">${p.port}</span>
      <span class="card-proc">${escapeHtml(p.process)}</span>
      ${protoBadge}${permBadge}
    </div>
    <div class="card-detail">${detail}</div>
  `;
  if (expandedSet.has(key)) el.classList.add('expanded');
}

function buildDetail(p) {
  return `
    <div class="row"><span class="label">PID: </span><span class="val">${p.pid ?? '?'}</span></div>
    <div class="row"><span class="label">cmd: </span><span class="val">${escapeHtml(p.cmdline || '(권한 부족)')}</span></div>
    <div class="row"><span class="label">remote: </span><span class="val">${p.remote || '—'}</span></div>
    <div class="row"><span class="label">family: </span><span class="val">${p.family}</span></div>
  `;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = String(s ?? '');
  return d.innerHTML;
}

async function poll() {
  if (scanInProgress) return;
  scanInProgress = true;
  try {
    const r = await fetch('/api/ports');
    const data = await r.json();
    render(data);
  } catch (e) {
    errorEl.style.display = '';
    errorEl.textContent = '서버 연결 실패';
  } finally {
    scanInProgress = false;
  }
}

poll();
setInterval(poll, POLL_INTERVAL * 1000);
</script>
</body>
</html>
