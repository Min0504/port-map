name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller --onefile --windowed --name port-map app.py
      - uses: actions/upload-artifact@v4
        with:
          name: port-map-${{ matrix.os }}
          path: dist/port-map*
